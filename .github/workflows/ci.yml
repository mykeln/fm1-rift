name: RIFT host checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  rift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install host dependencies
        run: python -m pip install Pillow fonttools mido
      - name: RIFT host integration with ASan and UBSan
        run: sh rift.sh test
      - name: Installer protocol against simulated hardware
        working-directory: firmware
        run: python tests/install_test.py
      - uses: actions/upload-artifact@v4
        with:
          name: rift-host-previews
          path: firmware/build/rift-demo/
